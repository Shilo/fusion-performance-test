; Sample override.cfg — copy this file to `override.cfg` (same directory)
; and fill in your real values. Godot auto-loads override.cfg over project.godot
; in both the editor and exported builds. `override.cfg` is gitignored so your
; secrets stay local. In CI, the GitHub Actions workflow writes its own
; override.cfg from the FUSION_APP_ID repo secret.
;
; Grab a Fusion app id from: https://dashboard.photonengine.com/publiccloud/

[fusion]

connection/app_id="your-fusion-app-id-here"
debug/log_level=0  ; 0=None, 1=Error, 2=Warning, 3=Info, 4=Debug, 5=Trace
