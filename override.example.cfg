; Sample override.cfg - copy this file to `override.cfg` (same directory)
; and fill in your real values for local editor/runtime testing. `override.cfg`
; is gitignored so your secrets stay local. In CI, the GitHub Actions workflow
; injects the FUSION_APP_ID repo secret into project.godot before Web export so
; the packaged build has the Fusion app id.
;
; Grab a Fusion app id from: https://dashboard.photonengine.com/publiccloud/

[fusion]

connection/app_id="your-fusion-app-id-here"
