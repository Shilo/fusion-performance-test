name: Build Godot Web Export

on:
  workflow_dispatch:
    inputs:
      godot_version:
        description: Godot version to download
        required: true
        default: "4.6"
      export_preset:
        description: Godot export preset to build
        required: true
        default: "Web"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  GODOT_STATUS: stable
  GODOT_VERSION: ${{ inputs.godot_version }}
  EXPORT_PRESET: ${{ inputs.export_preset }}
  EXPORT_DIR: build/web

jobs:
  build:
    name: Build web export
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Install Godot
        run: |
          set -euo pipefail

          download_url="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip"
          curl --fail --location --retry 3 --output godot.zip "$download_url"
          unzip -q godot.zip -d godot
          mv "godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" godot/godot
          chmod +x godot/godot
          echo "${GITHUB_WORKSPACE}/godot" >> "$GITHUB_PATH"

      - name: Point export preset at CI templates
        run: |
          set -euo pipefail

          debug_template="${GITHUB_WORKSPACE}/addons/fusion/export_templates/godot.web.template_debug.wasm32.nothreads.dlink.zip"
          release_template="${GITHUB_WORKSPACE}/addons/fusion/export_templates/godot.web.template_release.wasm32.nothreads.dlink.zip"

          test -f "$debug_template"
          test -f "$release_template"

          sed -i "s|^custom_template/debug=.*|custom_template/debug=\"${debug_template}\"|" export_presets.cfg
          sed -i "s|^custom_template/release=.*|custom_template/release=\"${release_template}\"|" export_presets.cfg

      - name: Register Fusion GDExtension
        run: |
          set -euo pipefail

          test -f addons/fusion/fusion.gdextension
          test -f addons/fusion/bin/libfusion.linux.editor.x86_64.release.so

          mkdir -p .godot
          printf '%s\n' 'res://addons/fusion/fusion.gdextension' > .godot/extension_list.cfg

      - name: Apply Fusion app id from secrets
        env:
          FUSION_APP_ID: ${{ secrets.FUSION_APP_ID }}
        run: |
          set -euo pipefail

          if [ -z "${FUSION_APP_ID}" ]; then
            echo "FUSION_APP_ID secret is not set." >&2
            exit 1
          fi

          cat > override.cfg <<EOF
          [fusion]

          connection/app_id="${FUSION_APP_ID}"
          debug/log_level=0
          EOF

          python3 <<'PY'
          from pathlib import Path
          import os
          import re

          def godot_string(value: str) -> str:
              return '"' + value.replace("\\", "\\\\").replace('"', '\\"') + '"'

          path = Path("project.godot")
          text = path.read_text(encoding="utf-8")
          line = "connection/app_id=" + godot_string(os.environ["FUSION_APP_ID"])
          match = re.search(r"(?ms)^\[fusion\]\n(?P<body>.*?)(?=^\[|\Z)", text)
          if match is None:
              text = text.rstrip() + "\n\n[fusion]\n\n" + line + "\n"
          else:
              body = match.group("body")
              if re.search(r"(?m)^connection/app_id=", body):
                  body = re.sub(r"(?m)^connection/app_id=.*$", line, body)
              else:
                  body = line + "\n" + body
              text = text[:match.start("body")] + body + text[match.end("body"):]
          path.write_text(text, encoding="utf-8")
          PY

          echo "Applied Fusion app id to CI project settings; app_id length=${#FUSION_APP_ID}"

      - name: Import project
        run: godot --headless --path "$GITHUB_WORKSPACE" --import --quit

      - name: Export web build
        run: |
          set -euo pipefail

          rm -rf "$EXPORT_DIR"
          mkdir -p "$EXPORT_DIR"

          godot --headless --path "$GITHUB_WORKSPACE" --export-release "$EXPORT_PRESET" "$EXPORT_DIR/index.html"
          test -f "$EXPORT_DIR/index.html"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.EXPORT_DIR }}

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
